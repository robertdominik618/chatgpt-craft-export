name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - name: Package browser builds
        run: |
          cd dist/chromium && zip -qr ../craft-export-chromium.zip .
          cd ../firefox && zip -qr ../craft-export-firefox.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: browser-builds
          path: |
            dist/craft-export-chromium.zip
            dist/craft-export-firefox.zip
